services:
  db:
    image: postgres:15-alpine
    container_name: agendamento_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Mapeia a porta 5433 da máquina para a 5432 do container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: agendamento_django
    restart: always
    # O entrypoint aplica as migrações, coleta os estáticos e sobe o gunicorn.
    # Para desenvolvimento com recarga automática, use também o docker-compose.dev.yml.
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # POSTGRES_HOST é o nome do serviço na rede do compose, independente do .env
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
