{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agendamento de Laboratórios</title>
    <link rel="stylesheet" href="{% static 'agendamentos/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'agendamentos/css/auth.css' %}">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">🖥️</div>

            <div class="auth-header">
                <p class="eyebrow">Acesso</p>
                <h1>LabManager</h1>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="form-alert form-alert-success">{{ message }}</div>
                {% endfor %}
            {% endif %}

            {% if form.errors %}
                <div class="form-alert form-alert-error">Usuário ou senha inválidos. Tente novamente.</div>
            {% endif %}

            <form method="post" class="form-stack">
                {% csrf_token %}

                <div class="field">
                    <label for="id_username">Usuário / Matrícula</label>
                    <input type="text" name="username" id="id_username" required autofocus>
                </div>

                <div class="field">
                    <label for="id_password">Senha</label>
                    <input type="password" name="password" id="id_password" required>
                </div>

                <button type="submit" class="auth-button">Entrar</button>
            </form>

            <div class="auth-footer">
                Não tem conta? <a href="{% url 'cadastrar' %}">Cadastre-se</a>
            </div>
        </div>
    </div>
</body>
</html>
